  - "5th checkpoint candidate identified but NOT added, per the explicit ask to stop at 4: P_regulatory_reasoning's T7->T12 pair is the same same-tuple/non-adjacent shape as T8->T13 (now T13c) — antitrust_analyst/regulatory_strategist_ai already bundle both from t=6. Would need a requirements checklist on T12 to formalize, same pattern as T13c."
  - "task_requirements_evaluator.py (requirements_met/task_credit) not built — requirements_catalog items have no grading function yet."
  - "common_evaluators.py / run_examples.py not touched — build_default_evaluators() still has no workflow parameter, so the requirements evaluator (once built) has nowhere to attach yet."
  - "CLOSED: offline_static vs runtime_dynamic. Resolved in favor of offline_static — a live ready-task-count signal would be manager-reactive (task completion timing depends on assignment quality), which disqualifies it as externally-triggered non-stationarity. No engine change needed; team.py's existing implementation already matches the decided design."
  - "CLOSED: load/capacity vs demand-driven churn. Resolved in favor of demand-driven — the engine has no per-agent concurrency limit, so a capacity threshold was never enforced. team.py rewritten to key joins/leaves on specialty need and bundle completion instead."
  - "Baseline diagnostic re-run against this variant requires scripts/run.sh, which calls the OpenAI API — NOT run in this pass per CLAUDE.md; needs an explicit, separate ask."
