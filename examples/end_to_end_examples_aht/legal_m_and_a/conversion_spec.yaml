derived_team_timeline:
  method: offline_static   # CONFIRMED as the correct target, not a stopgap — see docs/benchmark_aht/benchmark_conversion.md
  derivation_notes: >
    Baked into team.py::create_team_timeline() as a fixed dict, reusing the original
    scenario's 0/6/12/18/25/45/55 cadence where it lines up with when a specialty's demand
    window actually opens or a prior cold-start bundle actually completes (checked against
    each task's estimated_duration_hours, not just "a later timestep exists"). Not computed
    live at runtime — by design: the schedule must be independent of the manager's own
    decisions to count as externally-triggered non-stationarity (a live ready-task-count
    signal would be manager-reactive, since task completion timing depends on assignment
    quality, which defeats the point of testing adaptation to change the manager doesn't
    control). Derived from shared dependency structure (e.g. T6a/T6b's pools both become
    needed at t=6 because they share a dependency on T3), not from task identity, which is
    what keeps join/leave timing from telegraphing which agent is "meant for" which task.
    Every join is a one-shot cold-start bundle (rule 1) and every remove is gated on that
    bundle's completion plus no current need (rule 2) — see docs/benchmark_aht/index.md
    "Two design rules." Fixed in this revision: diligence_reader no longer hands its T4/T5
    work to senior_associate_ai on departure (t=12 in the prior version) — it now keeps the
    whole T3+T4+T5 bundle to completion and leaves at t=18 once genuinely done; and
    tax_structuring_ai no longer leaves the same timestep (t=18) it was assigned T8 — it now
    leaves at t=25, after T8 completes.
  events: "see team.py::create_team_timeline() — 21 events across 7 timesteps, verified by construction"

state_action_scoring_mapping:
  state_shape: >
    s = <G, W, C, X, U> — unchanged (symbols as defined in the base MA-Gym POSG
    formalization). W restructured into the 7 pools above. There is no load/capacity
    quantity computed anywhere — the engine has no per-agent concurrency limit
    (manager_agent_gym/core/execution/engine.py starts every ready task with an assigned
    agent concurrently regardless of what else that agent is running), so pool membership
    tracks which specialty is needed, not how many units of it exist.
  action_space: "Unchanged — no new manager-facing action added."
  transition_rule: >
    Join: when a task needs a specialty not already covered by an unfinished bundle on the
    roster, add one agent of that pool's trait tuple, cold-start-guessed onto every task in
    that demand window at once (rule 1). Leave: remove that agent only once every task in its
    bundle is COMPLETED and no ready task still needs the pool (rule 2). No load-driven
    scale-in, no injected failure, no hand-off to a different specialist mid-bundle exists in
    this build.
  episode_and_scoring: >
    Unchanged mechanically, but requirements_met/task_credit grading is NOT YET WIRED —
    requirements are declared on T6a/T6b/T13b (schema-level) but no evaluator reads them
    yet. See verification_checklist and open_questions.

preferences_audit:
  rubrics_referencing_dropped_roles: []   # confirmed empty — no rubric ever referenced an agent_id by name
  rubrics_needing_review:
    - "rule_disclosure_schedules_evidence_linked — FIXED in this pass (was matching 'Material Contracts', now matches both T6a/T6b names)"
    - "employment_matters_review (goal_achievement) — orphan rubric, no corresponding task exists in either the original or this variant; not fixed, flagged only"
    - "ip_portfolio_analysis (goal_achievement) — LLM-prompt based, not name-matching, unaffected by the T6 split but worth a content review given T6b now exists as a dedicated task"

verification_checklist:
  - item: "Custom aggregation callable on a non-empty-rubric-list Evaluator actually runs (task_credit threshold logic, not silent averaging)"
    status: unverified
  - item: "No preferences.py rubric references an agent_id dropped in human_role_audit"
    status: confirmed_working   # verified directly — no rubric in this file references any agent_id
  - item: "Every pool's remove event timestep is strictly after every task in its cold_start_bundle would plausibly be COMPLETED, and no ready task at that timestep still needs the pool (rule 2)"
    status: confirmed_working   # verified by hand against workflow.py's estimated_duration_hours and dependency_task_ids when the timeline was rewritten: diligence_reader (t=18, after T3/T4/T5), tax_structuring_ai (t=25, after T8, moved off the t=18 assignment-coincident timestep), redline_explainer (t=45, after T11), antitrust_analyst (t=55, after T7+T12)
  - item: "No remove event hands a departing agent's unfinished work to a different agent (rule 1)"
    status: confirmed_working   # verified by hand: senior_associate_ai's join (t=25) is tied to T10's own readiness, not to diligence_reader's departure (t=18) — the two events are independent and diligence_reader's bundle is already complete before senior_associate_ai ever joins
  - item: "No team_timeline join/leave reason string names a specific task ID (rule 3) — reasons describe specialty/capability demand only; task-to-agent fit is verified here, in this file, not asserted in code"
    status: confirmed_working   # verified directly: grep for task-ID patterns ("T<digit>") inside team.py's reason-string literals returns zero matches after the rule-3 rewrite

